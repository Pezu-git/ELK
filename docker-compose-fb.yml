services:
  elasticsearch:
    image: elasticsearch:8.12.2
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"  
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
    ports:
      - 9200:9200
    volumes:
      - ./deploy/esdata:/usr/share/elasticsearch/data
    deploy:
      resources:
        limits:
          memory: 1G    # Не больше 1GB
        reservations:
          memory: 512M  # Гарантированно 512MB
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10      

  kibana:
    image: kibana:8.12.2
    ports:
      - 5601:5601
    depends_on:
      - elasticsearch
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system 
      - ELASTICSEARCH_PASSWORD=POT654kds  #Пароль для kibana_system

  logstash:
    image: logstash:8.12.2
    environment:
      xpack.monitoring.elasticsearch.username: "elastic"
      xpack.monitoring.elasticsearch.password: "POT654kds"
      ES_HOST: "http://elasticsearch:9200"
      "LS_JAVA_OPTS": "-Xms256m -Xmx256m"
    ports:
      - "5044:5044/tcp"
    restart: always 
    volumes:
      - ./configs/logstash/config.yml:/usr/share/logstash/config/logstash.yml   
      - ./configs/logstash/pipelines.yml:/usr/share/logstash/config/pipelines.yml  
      - ./configs/logstash/pipelines:/usr/share/logstash/config/pipelines 
      - /var/log/nginx:/usr/share/logstash/nginx 
    depends_on:
      elasticsearch:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M    

  filebeat:
    image: elastic/filebeat:8.12.2
    command: filebeat -e -strict.perms=false
    volumes:
      - ./configs/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml
      - /var/log/nginx:/usr/share/filebeat/nginx:ro
    depends_on:
      - logstash
      - elasticsearch
      - kibana      


